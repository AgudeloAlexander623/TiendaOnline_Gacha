  # --- fin de rutas ---

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT emitido por el identity-service. Payload:
        `{ sub, role, email }`. Se envía como `Authorization: Bearer <token>`.

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CartItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DiscountLevelId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BannerId:
      name: bannerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PackageId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    ValidationError:
      description: 'Datos de entrada inválidos (`code: VALIDATION_ERROR`).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: |
        Falta el token (`MISSING_TOKEN`), es inválido/expirado (`INVALID_TOKEN`) o no
        hay usuario en la petición (`UNAUTHENTICATED`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 'El usuario autenticado no tiene el rol requerido (`code: FORBIDDEN`).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 'El recurso no existe (`code: NOT_FOUND` o un código específico del dominio).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    # ---------- Errores y utilidades ----------
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Código público estable, en inglés y MAYÚSCULAS.
          example: NOT_FOUND
        message:
          type: string
          description: Mensaje en español para el usuario final.
          example: Ruta no encontrada
        details:
          type: array
          description: 'Solo en errores de validación.'
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    HealthLiveness:
      type: object
      required: [service, status, timestamp]
      properties:
        service: { type: string, example: identity-service }
        status: { type: string, const: ok }
        timestamp: { type: string, format: date-time }
    HealthReadiness:
      type: object
      required: [service, status]
      properties:
        service: { type: string, example: identity-service }
        status: { type: string, enum: [ready, not_ready] }

    # ---------- Identidad ----------
    User:
      type: object
      required: [id, email, displayName, role, status, emailVerified, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [PLAYER, ADMIN] }
        status: { type: string, enum: [ACTIVE, SUSPENDED, PENDING] }
        emailVerified: { type: boolean }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 8, maxLength: 128 }
        displayName: { type: string, minLength: 2, maxLength: 80 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 1, maxLength: 128 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 10 }
    UpdateProfileRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 80 }
    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, SUSPENDED, PENDING] }
    AuthTokens:
      type: object
      required: [accessToken, refreshToken, accessExpiresIn, refreshExpiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        accessExpiresIn: { type: string, example: 15m }
        refreshExpiresIn: { type: string, example: 7d }
    AuthResult:
      type: object
      required: [user, tokens]
      properties:
        user: { $ref: '#/components/schemas/User' }
        tokens: { $ref: '#/components/schemas/AuthTokens' }
    PaginatedUsers:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    # ---------- Tienda: catálogo ----------
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        isActive: { type: boolean }
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        price: { type: number, description: 'Precio unitario (calculado en el servidor)' }
        currency: { type: string, example: COP }
        isActive: { type: boolean }
        category: { oneOf: [{ $ref: '#/components/schemas/Category' }, { type: 'null' }] }
        images: { type: array, items: { type: string, format: uri } }
        availableStock: { type: integer, description: 'stock - reservado' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaginatedProducts:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    CreateProductRequest:
      type: object
      required: [sku, name, slug, price]
      properties:
        sku: { type: string, minLength: 2, maxLength: 60 }
        name: { type: string, minLength: 2, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9-]+$', maxLength: 180 }
        description: { type: string, maxLength: 2000 }
        price: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3, default: COP }
        categoryId: { type: string, format: uuid }
        stock: { type: integer, minimum: 0, default: 0 }
        images:
          type: array
          maxItems: 10
          items: { type: string, format: uri }
    UpdateProductRequest:
      description: Todos los campos del producto son opcionales (sin `stock` ni `images`).
      type: object
      properties:
        sku: { type: string, minLength: 2, maxLength: 60 }
        name: { type: string, minLength: 2, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9-]+$' }
        description: { type: string, maxLength: 2000 }
        price: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        categoryId: { type: string, format: uuid }
    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string, pattern: '^[a-z0-9-]+$' }
        description: { type: string, maxLength: 500 }
    UpdateCategoryRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string, pattern: '^[a-z0-9-]+$' }
        description: { type: string, maxLength: 500 }
        isActive: { type: boolean }

    # ---------- Tienda: inventario ----------
    Inventory:
      type: object
      properties:
        productId: { type: string, format: uuid }
        stock: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
    AdjustStockRequest:
      type: object
      required: [type, quantity]
      properties:
        type: { type: string, enum: [IN, OUT, ADJUSTMENT] }
        quantity: { type: integer }
        reason: { type: string, maxLength: 300 }

    # ---------- Tienda: carrito y pedidos ----------
    Cart:
      type: object
      required: [cartId, status, items, subtotal, currency, totalItems]
      properties:
        cartId: { type: string, format: uuid }
        status: { type: string, example: ACTIVE }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              name: { type: string }
              unitPrice: { type: number }
              quantity: { type: integer }
              lineTotal: { type: number }
        subtotal: { type: number }
        currency: { type: string }
        totalItems: { type: integer }
    AddCartItemRequest:
      type: object
      required: [productId]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99, default: 1 }
    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 99 }
    CheckoutRequest:
      type: object
      properties:
        discountLevelId:
          type: string
          format: uuid
          description: |
            Nivel de descuento a canjear. **Límite conocido:** el débito de monedas
            asociado está pendiente de endurecer.
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string }
        userId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, PAID, SHIPPED, DELIVERED, CANCELLED] }
        subtotal: { type: number }
        discountAmount: { type: number }
        total: { type: number }
        currency: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              nameSnapshot: { type: string }
              unitPrice: { type: number }
              quantity: { type: integer }
              lineTotal: { type: number }
    PaginatedOrders:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [PENDING, PAID, SHIPPED, DELIVERED, CANCELLED] }

    # ---------- Tienda: descuentos ----------
    DiscountLevel:
      type: object
      properties:
        id: { type: string, format: uuid }
        level: { type: integer, description: 'Nivel 1..5' }
        percentage: { type: number, description: 'Porcentaje de descuento (10..90)' }
        coinsRequired: { type: integer }
        description: { type: [string, 'null'] }
        isActive: { type: boolean }
    DiscountLevelRequest:
      type: object
      required: [level, percentage, coinsRequired]
      properties:
        level: { type: integer, minimum: 1, maximum: 5 }
        percentage: { type: number }
        coinsRequired: { type: integer, minimum: 0 }
        description: { type: string, maxLength: 300 }

    # ---------- Economía ----------
    WalletBalance:
      type: object
      required: [walletId, balance]
      properties:
        walletId: { type: string, format: uuid }
        balance: { type: integer, description: 'Saldo total vigente, calculado por el servidor' }
    CoinBatch:
      type: object
      description: Lote de monedas (las ganadas vencen; las compradas no).
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [EARNED, PURCHASED] }
        source: { type: string }
        originalAmount: { type: integer }
        remainingAmount: { type: integer }
        expiresAt: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [ACTIVE, EXHAUSTED, EXPIRED] }
        createdAt: { type: string, format: date-time }
    CoinTransaction:
      type: object
      description: Movimiento inmutable del libro mayor de monedas.
      properties:
        id: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        type: { type: string, enum: [EARN, SPEND, EXPIRE, ADJUSTMENT] }
        amount: { type: integer }
        balanceAfter: { type: integer }
        reason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    PaginatedBatches:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CoinBatch' }
    PaginatedTransactions:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CoinTransaction' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    GachaBanner:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        costPerPull: { type: integer }
        isActive: { type: boolean }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        rewards:
          type: array
          items: { $ref: '#/components/schemas/GachaReward' }
    GachaReward:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        rarity: { type: string, enum: [COMMON, RARE, EPIC, LEGENDARY] }
        rewardType: { type: string }
        coinValue: { type: [integer, 'null'] }
        weight: { type: integer, description: 'Peso del sorteo (mayor peso = más probable)' }
        isActive: { type: boolean }
    GachaPullResult:
      type: object
      required: [pullId, banner, costCoins, isWin, reward, balance]
      properties:
        pullId: { type: string, format: uuid }
        banner:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        costCoins: { type: integer }
        isWin: { type: boolean }
        reward:
          oneOf:
            - type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                rarity: { type: string }
                rewardType: { type: string }
                coinValue: { type: [integer, 'null'] }
                itemName: { type: [string, 'null'] }
            - type: 'null'
        balance: { type: integer, description: 'Saldo tras la tirada' }
    GameSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        gameType: { type: string, enum: [MINIGAME] }
        status: { type: string }
        score: { type: [integer, 'null'] }
        coinsAwarded: { type: [integer, 'null'] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    StartSessionRequest:
      type: object
      properties:
        gameType: { type: string, enum: [MINIGAME], default: MINIGAME }
    FinishSessionRequest:
      type: object
      required: [score]
      properties:
        score: { type: integer, minimum: 0, maximum: 1000000 }
    PlayerItem:
      type: object
      description: Objeto del inventario del jugador obtenido (entre otros) en el gacha.
      properties:
        id: { type: string, format: uuid }
        itemName: { type: string }
        rarity: { type: string }
        quantity: { type: integer }
        acquiredAt: { type: string, format: date-time }

    # ---------- Pagos ----------
    CoinPackage:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        coins: { type: integer }
        price: { type: number }
        currency: { type: string }
        isActive: { type: boolean }
    CoinPackageRequest:
      type: object
      required: [name, slug, coins, price]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string, pattern: '^[a-z0-9-]+$' }
        coins: { type: integer, minimum: 1 }
        price: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3, default: COP }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        orderId: { type: [string, 'null'], format: uuid }
        amount: { type: number }
        currency: { type: string }
        provider:
          type: string
          enum: [MOCK, STRIPE, MERCADOPAGO]
          description: |
            Proveedor del pago. Hoy solo `MOCK` está operativo (pago simulado); los
            demás son valores reservados para integraciones futuras, no disponibles.
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, REFUNDED, CANCELLED] }
        externalId: { type: [string, 'null'] }
        failureReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        recharges: { type: array, items: { $ref: '#/components/schemas/Recharge' } }
    CreatePaymentRequest:
      type: object
      required: [amount]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        orderId: { type: string, format: uuid }
        provider:
          type: string
          enum: [MOCK, STRIPE, MERCADOPAGO]
          description: |
            Proveedor del pago. Hoy solo `MOCK` está operativo (pago simulado); los
            demás son valores reservados para integraciones futuras, no disponibles.
    PaginatedPayments:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    RefundRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 300 }
    Recharge:
      type: object
      properties:
        id: { type: string, format: uuid }
        packageId: { type: [string, 'null'], format: uuid }
        coins: { type: integer }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED, REFUNDED] }
        createdAt: { type: string, format: date-time }
    CreateRechargeRequest:
      type: object
      required: [packageId]
      properties:
        packageId: { type: string, format: uuid }
    PaginatedRecharges:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Recharge' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
