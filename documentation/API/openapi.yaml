openapi: 3.1.0

info:
  title: GearQuest API
  version: 0.1.0
  summary: Contrato de los 4 microservicios de GearQuest (identidad, tienda, economía y pagos).
  description: |
    Contrato de la API HTTP de GearQuest, extraído **directamente del código** de los
    cuatro servicios de `backend/services/`. Es la fuente de verdad para el frontend, el
    juego (Godot) y cualquier cliente futuro.

    ### Cómo está organizado
    - Cada servicio escucha en su propio puerto y expone su propio `/health`.
    - Todas las rutas de negocio viven bajo `/api/v1/…`.
    - El **identity-service** es el único que emite tokens; los demás **verifican** el JWT
      con el mismo secreto compartido (`JWT_SECRET`). No hay llamadas entre servicios.

    ### Autenticación
    Se usa **JWT Bearer**: el cliente obtiene un `accessToken` en `/auth/register`,
    `/auth/login` o `/auth/refresh` y lo envía en cada petición protegida:

    ```
    Authorization: Bearer <accessToken>
    ```

    Las operaciones con `security: [bearerAuth: []]` exigen token válido. Las marcadas con
    `authenticate + requireRole("ADMIN")` exigen además que el token tenga `role: ADMIN`
    (si no, responden `403 FORBIDDEN`).

    ### Formato de respuesta y errores
    - Éxito: el recurso en JSON, o `{ "data": …, "meta": … }` en listados paginados.
    - Error: **siempre** `{ "code": "...", "message": "...", "details": [...] }`.
      - `code` es un **contrato público estable** en inglés y MAYÚSCULAS (no cambia).
      - `message` es un texto en español pensado para el usuario final.
      - `details` solo aparece en errores de validación (`VALIDATION_ERROR`).
    - Códigos transversales: `VALIDATION_ERROR` (400), `MISSING_TOKEN` / `INVALID_TOKEN`
      / `UNAUTHENTICATED` (401), `FORBIDDEN` (403), `NOT_FOUND` (404), `INTERNAL_ERROR` (500).

    > **Nivel de detalle del contrato:** los esquemas describen los campos que el código
    > **serializa realmente** (no columnas internas). Para el modelo de datos completo, ver
    > la sección de cada servicio en `prisma/schema.prisma`. Este documento no sustituye al
    > esquema: lo resume para el consumidor de la API.

    > **Alcance del contrato:** este documento describe lo que el código responde **hoy**.
    > Algunas reglas de negocio aún se están **endureciendo** (canje de descuentos con
    > débito de monedas y acreditación de monedas compradas). Se registran como **límites
    > conocidos** para no prometer comportamiento que todavía no existe; el detalle se
    > mantiene en el seguimiento interno del proyecto (`documentation/Trazabilidad.md`).

servers:
  - url: http://localhost:3001
    description: identity-service (auth y usuarios)
  - url: http://localhost:3002
    description: store-service (catálogo, inventario, carrito, pedidos, descuentos)
  - url: http://localhost:3003
    description: economy-service (monedero, movimientos, gacha, minijuego, inventario de jugador)
  - url: http://localhost:3004
    description: payments-service (paquetes, pagos, recargas)

tags:
  - name: Health
    description: Estado de cada servicio (liveness y readiness).
  - name: Auth
    description: Registro, sesión y tokens (identity-service).
  - name: Users
    description: Usuarios y perfil (identity-service).
  - name: Catalog
    description: Categorías y productos (store-service).
  - name: Inventory
    description: Existencias por producto (store-service).
  - name: Carts
    description: Carrito del usuario (store-service).
  - name: Orders
    description: Pedidos y checkout (store-service).
  - name: Discounts
    description: Niveles de descuento canjeables con monedas (store-service).
  - name: Wallet
    description: Monedero, saldo y lotes de monedas (economy-service).
  - name: Transactions
    description: Historial de movimientos de monedas (economy-service).
  - name: Gacha
    description: Ruleta (banners, premios y tiradas) (economy-service).
  - name: Rewards
    description: Sesiones del minijuego y acreditación (economy-service).
  - name: PlayerItems
    description: Inventario de objetos del jugador (economy-service).
  - name: Packages
    description: Paquetes de monedas de la tienda (payments-service).
  - name: Payments
    description: Pagos simulados (payments-service).
  - name: Recharges
    description: Recargas de monedas (payments-service).

security: []

paths:

  # ==========================================================================
  # Health — los 4 servicios exponen el mismo contrato
  # ==========================================================================
  /health:
    get:
      tags: [Health]
      operationId: healthLiveness
      summary: Liveness — el proceso responde
      description: Responde 200 si el proceso está vivo. No toca la base de datos.
      security: []
      responses:
        '200':
          description: Servicio vivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLiveness'
  /health/ready:
    get:
      tags: [Health]
      operationId: healthReadiness
      summary: Readiness — la base de datos responde
      description: Ejecuta `SELECT 1` contra la base de datos. Responde 503 si falla.
      security: []
      responses:
        '200':
          description: Servicio listo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadiness'
        '503':
          description: La base de datos no responde.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadiness'

  # ==========================================================================
  # AUTH — identity-service (:3001)
  # ==========================================================================
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Registrar un usuario nuevo
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario creado con sus tokens de sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: El correo ya está registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada (usuario + tokens).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Renovar el par de tokens
      description: Rota el refresh token (el anterior deja de ser válido).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Par de tokens renovado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          description: Refresh token inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Cerrar sesión (revocar el refresh token)
      description: 'Es idempotente: un token inválido no se considera error.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getAuthMe
      summary: Perfil del usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datos públicos del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ==========================================================================
  # USERS — identity-service (:3001)
  # ==========================================================================
  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getMyProfile
      summary: Consultar mi perfil
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Users]
      operationId: updateMyProfile
      summary: Actualizar mi perfil
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/users/:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Listar usuarios (solo ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, SUSPENDED, PENDING]
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Listado paginado de usuarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/users/{id}:
    get:
      tags: [Users]
      operationId: getUserById
      summary: Consultar un usuario por id (solo ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Usuario solicitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/users/{id}/status:
    patch:
      tags: [Users]
      operationId: updateUserStatus
      summary: Cambiar el estado de un usuario (solo ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Usuario con su nuevo estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ==========================================================================
  # CATALOG — store-service (:3002)
  # ==========================================================================
  /api/v1/categories/:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: Listar categorías
      security: []
      responses:
        '200':
          description: Listado de categorías.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [Catalog]
      operationId: createCategory
      summary: Crear una categoría (solo ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryRequest' }
      responses:
        '201':
          description: Categoría creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/categories/{id}:
    get:
      tags: [Catalog]
      operationId: getCategory
      summary: Detalle de una categoría
      security: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Categoría solicitada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Catalog]
      operationId: updateCategory
      summary: Editar una categoría (solo ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategoryRequest' }
      responses:
        '200':
          description: Categoría actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Catalog]
      operationId: deleteCategory
      summary: Eliminar una categoría (solo ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Categoría desactivada/eliminada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/products/:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: Listar el catálogo (paginado y filtrable)
      security: []
      parameters:
        - name: categoryId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: includeInactive
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de productos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedProducts' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Catalog]
      operationId: createProduct
      summary: Crear un producto (solo ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
      responses:
        '201':
          description: Producto creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/products/slug/{slug}:
    get:
      tags: [Catalog]
      operationId: getProductBySlug
      summary: Detalle de un producto por su slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        '200':
          description: Producto solicitado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/products/{id}:
    get:
      tags: [Catalog]
      operationId: getProduct
      summary: Detalle de un producto por id
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Producto solicitado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Catalog]
      operationId: updateProduct
      summary: Editar un producto (solo ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductRequest' }
      responses:
        '200':
          description: Producto actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Catalog]
      operationId: deleteProduct
      summary: Eliminar un producto (solo ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Producto eliminado/desactivado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================================
  # INVENTORY — store-service (:3002)
  # ==========================================================================
  /api/v1/inventory/{productId}:
    get:
      tags: [Inventory]
      operationId: getInventory
      summary: Consultar existencias de un producto (solo ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Existencias del producto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inventory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Inventory]
      operationId: adjustStock
      summary: Ajustar existencias (entrada, salida o ajuste) (solo ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustStockRequest' }
      responses:
        '200':
          description: Existencias tras el ajuste.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inventory' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ==========================================================================
  # CARTS — store-service (:3002)
  # ==========================================================================
  /api/v1/carts/me:
    get:
      tags: [Carts]
      operationId: getMyCart
      summary: Consultar mi carrito activo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Carrito activo (se crea si no existe).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Carts]
      operationId: clearCart
      summary: Vaciar mi carrito
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Carrito vacío.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/carts/items:
    post:
      tags: [Carts]
      operationId: addCartItem
      summary: Agregar un producto al carrito
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCartItemRequest' }
      responses:
        '201':
          description: Carrito con el artículo agregado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: El producto no existe o no está disponible (`PRODUCT_NOT_AVAILABLE`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/carts/items/{itemId}:
    patch:
      tags: [Carts]
      operationId: updateCartItem
      summary: Cambiar la cantidad de un artículo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CartItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCartItemRequest' }
      responses:
        '200':
          description: Carrito actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Carts]
      operationId: removeCartItem
      summary: Quitar un artículo del carrito
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CartItemId'
      responses:
        '200':
          description: Carrito sin el artículo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ==========================================================================
  # ORDERS — store-service (:3002)
  # ==========================================================================
  /api/v1/orders/checkout:
    post:
      tags: [Orders]
      operationId: checkout
      summary: Confirmar el pedido (checkout)
      description: |
        Convierte el carrito activo en un pedido dentro de una transacción:
        valida existencias, descuenta inventario y guarda el snapshot de precios.
        **Límite conocido:** la aplicación del descuento por monedas
        (`discountLevelId`) está pendiente de endurecer en el backend.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: Pedido creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/orders/me:
    get:
      tags: [Orders]
      operationId: listMyOrders
      summary: Consultar mis pedidos
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, PAID, SHIPPED, DELIVERED, CANCELLED]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de pedidos del usuario.
          content:
